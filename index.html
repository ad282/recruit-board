<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<title>ExKey 採用ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}

/* Layout: 左に濃紺のサイドメニュー（件数バッジ）、右に上部バーと白カードの作業エリア。ホームは数値カード→やること→面談予定・媒体別グラフ＋右に最近の動き */
:root{
  --bg:#eef1f7; --card:#ffffff; --card-2:#f5f7fb; --line:#e3e7ef;
  --ink:#1e2433; --ink-2:#5b6478; --ink-3:#98a0b3;
  --side:#1b1f33; --side-ink:#c9cfe0; --side-active:#262b45;
  --accent:#2f5be7; --accent-ink:#ffffff; --accent-soft:#e6ecfd;
  --green:#22a876; --green-soft:#e1f5ed; --orange:#e08a12; --orange-soft:#fdf1df;
  --red:#e0474c; --red-soft:#fde6e7; --grey-soft:#eef0f4;
  --shadow:0 1px 3px rgba(30,36,51,.06),0 4px 14px rgba(30,36,51,.04);
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"Roboto Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151f; --card:#1b2030; --card-2:#222838; --line:#2c3347;
  --ink:#e7eaf2; --ink-2:#a6adbf; --ink-3:#6f778b;
  --side:#0c0e17; --side-ink:#a9b0c4; --side-active:#1b2030;
  --accent:#6b8cff; --accent-ink:#0c0e17; --accent-soft:#232d4f;
  --green:#4fd19f; --green-soft:#17352b; --orange:#f2b158; --orange-soft:#3a2c16;
  --red:#ff7d81; --red-soft:#3d2023; --grey-soft:#262c3c;
  --shadow:0 1px 3px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151f; --card:#1b2030; --card-2:#222838; --line:#2c3347;
  --ink:#e7eaf2; --ink-2:#a6adbf; --ink-3:#6f778b;
  --side:#0c0e17; --side-ink:#a9b0c4; --side-active:#1b2030;
  --accent:#6b8cff; --accent-ink:#0c0e17; --accent-soft:#232d4f;
  --green:#4fd19f; --green-soft:#17352b; --orange:#f2b158; --orange-soft:#3a2c16;
  --red:#ff7d81; --red-soft:#3d2023; --grey-soft:#262c3c;
  --shadow:0 1px 3px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
aside.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:4px;padding-block:20px;position:sticky;top:0;height:100vh;padding-left:max(0px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px 18px;color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 20px;font-size:14px;border-left:3px solid transparent;color:var(--side-ink)}
.nav button:hover{background:var(--side-active)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav button[aria-current="page"]{background:var(--side-active);border-left-color:var(--accent);color:#fff}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-family:var(--f-num);font-size:11px;padding:0 7px;border-radius:999px;min-width:20px;text-align:center}
.side .foot{margin-top:auto;padding:0 20px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
main{display:flex;flex-direction:column;gap:16px;padding-block:16px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 16px}
.topbar input{font:inherit;flex:1 1 220px;max-width:360px;min-width:0;border:1px solid var(--line);background:var(--card-2);color:var(--ink);border-radius:999px;padding:6px 14px}
.topbar .date{margin-left:auto;font-family:var(--f-num);color:var(--ink-2);font-size:13px}
.topbar .mode{font-size:12px;color:var(--ink-2);background:var(--card-2);border-radius:999px;padding:3px 10px}
h2{font-size:15px;margin:0;font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .hd .more{all:unset;cursor:pointer;color:var(--accent);font-size:12.5px}
.grid-home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{all:unset;cursor:pointer;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:14px}
.kpi:focus-visible{outline:2px solid var(--accent)}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:20px;height:20px;fill:none;stroke-width:1.8}
.kpi .n{font-family:var(--f-num);font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-2)}
.ic.blue{background:var(--accent-soft)} .ic.blue svg{stroke:var(--accent)}
.ic.green{background:var(--green-soft)} .ic.green svg{stroke:var(--green)}
.ic.orange{background:var(--orange-soft)} .ic.orange svg{stroke:var(--orange)}
.ic.red{background:var(--red-soft)} .ic.red svg{stroke:var(--red)}
.todo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.todo button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:8px;position:relative;text-align:center;font-size:12.5px;color:var(--ink-2)}
.todo button:hover{background:var(--card-2)}
.todo button:focus-visible{outline:2px solid var(--accent)}
.todo .tn{font-family:var(--f-num);font-size:20px;font-weight:700;color:var(--ink)}
.todo .dot{position:absolute;top:8px;right:calc(50% - 22px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--ink-2);text-align:left;background:var(--card-2);padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--f-num);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.blue{color:var(--accent)} .st.green{color:var(--green)} .st.orange{color:var(--orange)} .st.red{color:var(--red)} .st.grey{color:var(--ink-3)}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:18px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar .v{font-family:var(--f-num);font-size:11.5px;color:var(--ink-2)}
.bar .b{width:14px;border-radius:7px 7px 2px 2px;background:var(--accent);min-height:2px}
.bar .k{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tl{display:flex;flex-direction:column;gap:2px;max-height:620px;overflow:auto}
.tl .day{align-self:flex-start;font-family:var(--f-num);font-size:11.5px;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:0 8px;margin:8px 0 4px}
.tl .it{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;padding:6px 0}
.tl .it::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px}
.tl .it.g::before{background:var(--green)} .tl .it.o::before{background:var(--orange)} .tl .it.r::before{background:var(--red)}
.tl .t{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3)}
.tl .x{font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);padding:3px 12px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible{outline:2px solid var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.app-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;border-left:3px solid transparent}
.app-card.late{border-left-color:var(--orange)}
.app-card .nm{font-weight:700;font-size:15.5px}
.app-card .mt{color:var(--ink-2);font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:4px;background:var(--grey-soft);color:var(--ink-2)}
.tag.job{background:var(--accent-soft);color:var(--accent)}
.tag.late{background:var(--orange-soft);color:var(--orange)}
.sum{grid-column:1/-1;white-space:pre-wrap;font-size:13px;background:var(--card-2);border-radius:6px;padding:8px 12px;min-width:0}
.sum.empty{color:var(--ink-3)}
.note{grid-column:1/-1;font-size:12.5px;border-radius:6px;padding:6px 10px;background:var(--accent-soft);color:var(--accent)}
.note.warn{background:var(--red-soft);color:var(--red)}
.note.reply{background:var(--orange-soft);color:var(--ink)}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{justify-self:end;align-self:start;font-size:12px;padding:2px 10px;border-radius:999px;white-space:nowrap}
.p-未選考{background:var(--orange-soft);color:var(--orange)}
.p-通過,.p-日程調整中,.p-選考中{background:var(--accent-soft);color:var(--accent)}
.p-送信確認待ち,.p-要確認{background:var(--red-soft);color:var(--red)}
.p-日程確定{background:var(--green-soft);color:var(--green)}
.p-見送り{background:var(--grey-soft);color:var(--ink-3)}
.empty{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:28px;text-align:center;color:var(--ink-2)}
form.req{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
form.req label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
form.req .wide{grid-column:1/-1}
form.req select,form.req input,form.req textarea{font:inherit;color:var(--ink);background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
form.req textarea{min-height:80px;resize:vertical}
.banner{font-size:13px;padding:8px 12px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.banner.err{background:var(--red-soft);color:var(--red)}
.muted{color:var(--ink-3);font-size:12.5px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-title h1{font-size:19px;margin:0}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.jobcard{all:unset;cursor:pointer;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--accent)}
.jobcard.idle{border-top-color:var(--line)}
.jobcard:hover{box-shadow:0 4px 18px rgba(47,91,231,.15)}
.jobcard:focus-visible{outline:2px solid var(--accent)}
.jobcard .jn{font-size:17px;font-weight:700}
.jobcard .js{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.jobcard .js div{display:flex;flex-direction:column;font-size:11.5px;color:var(--ink-2)}
.jobcard .js b{font-family:var(--f-num);font-size:18px;color:var(--ink)}
.curjob{margin:0 14px 12px;display:flex;flex-direction:column;gap:6px;background:var(--side-active);border-radius:8px;padding:10px 12px}
.curjob .cj{color:#fff;font-weight:700;font-size:14px}
.curjob button{all:unset;cursor:pointer;font-size:12px;color:var(--side-ink);text-decoration:underline}
.linkname{all:unset;cursor:pointer;font-weight:700;color:var(--ink);border-bottom:1px dotted var(--ink-3)}
.linkname:hover{color:var(--accent)}
.linkname:focus-visible{outline:2px solid var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(15,18,30,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--card);width:min(560px,100%);height:100%;overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);border-top:1px solid var(--line)}
.kv div{padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px;white-space:pre-wrap;word-break:break-word;min-width:0}
.kv div:nth-child(odd){color:var(--ink-2);background:var(--card-2)}
.stbl td,.stbl th{font-size:12.5px;white-space:nowrap}
@media (max-width:1100px){.grid-home{grid-template-columns:minmax(0,1fr)}.tl{max-height:none}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside.side{position:static;height:auto;flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));overflow-x:auto;gap:0}
  .brand{padding:0 12px 0 0}.brand span{display:none}
  .nav{flex-direction:row}.nav button{padding:8px 12px;border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  .nav button[aria-current="page"]{border-bottom-color:var(--accent)}
  .nav button .lbl{font-size:13px}.side .foot{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}
  .todo{grid-template-columns:repeat(2,minmax(0,1fr))}
  form.req{grid-template-columns:minmax(0,1fr)}
  .app-card{grid-template-columns:minmax(0,1fr)}.pill{justify-self:start}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.todo{grid-template-columns:repeat(5,minmax(0,1fr))}
.task-label{grid-column:1/-1;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:6px;background:var(--orange-soft);color:var(--orange)}
.task-label.t-after{background:var(--accent-soft);color:var(--accent)}
.task-label.t-send,.task-label.t-check{background:var(--red-soft);color:var(--red)}
.tag.ok{background:var(--green-soft);color:var(--green)}
.p-実施済み{background:var(--accent-soft);color:var(--accent)}
.p-内定{background:var(--green-soft);color:var(--green)}
.p-辞退,.p-欠席{background:var(--grey-soft);color:var(--ink-3)}
.today-card{background:var(--card-2);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;align-items:start}
.today-card .tc-time{font-family:var(--f-num);font-size:18px;font-weight:700;color:var(--accent)}
.today-card .acts{grid-column:1/-1}
.inline-form{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card-2);border-radius:6px;padding:10px 12px}
.inline-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.inline-form select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.inline-form .wide{flex-basis:100%}
.drawer.wide{width:min(860px,100%)}
.ivsheet{display:flex;flex-direction:column;gap:10px}
.ivsheet h3{font-size:14px;margin:6px 0 0;padding-left:8px;border-left:3px solid var(--accent)}
.ivhead th,.ivhead td{text-align:center;border:1px solid var(--line);font-size:12.5px;padding:6px 8px}
.ivtext{white-space:pre-wrap;font-size:13px;line-height:1.7;background:var(--card-2);border-radius:6px;padding:10px 12px}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lg-box{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.lg-box form{display:flex;flex-direction:column;gap:10px}
.lg-box label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.lg-box input{font:inherit;font-size:16px;color:var(--ink);background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.lg-brand{padding:0;color:var(--ink)}
.lg-msg{margin:0;font-size:13px;color:var(--ink-2);min-height:1em}
.topbar .who{font-size:12px;color:var(--ink-2)}
.topbar .lo{all:unset;cursor:pointer;font-size:12px;color:var(--accent)}
@media (max-width:860px){.todo{grid-template-columns:repeat(2,minmax(0,1fr))}.today-card{grid-template-columns:minmax(0,1fr)}}
.rangebar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
.rangebar .rg{display:flex;align-items:center;gap:6px;margin-left:auto}
.rangebar input{font:inherit;color:var(--ink);background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.kpis .kpi{cursor:default}
.funnel{display:flex;flex-direction:column;gap:8px}
.fn-row{display:grid;grid-template-columns:110px minmax(0,1fr) 140px;gap:10px;align-items:center}
.fn-l{font-size:12.5px;color:var(--ink-2)}
.fn-t{background:var(--card-2);border-radius:6px;height:30px}
.fn-b{height:100%;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:34px}
.fn-b b{color:#fff;font-family:var(--f-num);font-size:13px}
.fn-row:last-child .fn-b{background:var(--green)}
.fn-r{font-size:12px;color:var(--ink-2);font-family:var(--f-num)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr) 36px;gap:4px 10px;align-items:center}
.hb-l{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{background:var(--card-2);border-radius:4px;height:14px}
.hb-b{height:100%;background:var(--accent);border-radius:4px}
.hb-n{font-family:var(--f-num);font-weight:700;text-align:right}
.hb-s{grid-column:2/-1;font-size:11.5px;color:var(--ink-3)}
.cellbar{display:inline-flex;align-items:center;gap:6px;min-width:80px}
.cellbar i{display:inline-block;height:8px;border-radius:4px;background:var(--accent);max-width:60px;flex:none}
.bars.wk{height:190px;overflow-x:auto}
.bars.wk .bar{min-width:42px}
.stack{width:18px;background:var(--accent-soft);border-radius:6px 6px 2px 2px;display:flex;flex-direction:column;justify-content:flex-end;min-height:2px;overflow:hidden}
.stack .b2{background:var(--accent)}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:8px}
.legend .lg1{background:var(--accent-soft)} .legend .lg2{background:var(--accent)}
details.card summary{cursor:pointer;list-style:none}
details.card h3{font-size:13.5px;margin:10px 0 4px}
@media (max-width:860px){.fn-row{grid-template-columns:80px minmax(0,1fr)}.fn-r{grid-column:2}.rangebar .rg{margin-left:0}}
.today-card .tc-time{display:flex;flex-direction:column;line-height:1.2}
.today-card .tc-time.past{color:var(--orange)}
.today-card .tc-time span{font-size:12px;font-weight:500}
.st-block{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.st-block h3{font-size:14px;margin:0}
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pg{background:var(--card-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.pg-l{font-size:12.5px;color:var(--ink-2)}.pg-l span{display:block;font-size:11px;color:var(--ink-3)}
.pg-n b{font-family:var(--f-num);font-size:20px}.pg-n span{font-size:12px;color:var(--ink-2)}
.pg-t{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.pg-b{height:100%;background:var(--accent)}.pg-b.ok{background:var(--green)}
.pg-s{font-size:11.5px;color:var(--ink-2);font-family:var(--f-num)}
.stbl2{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.stbl2 th,.stbl2 td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.stbl2 thead th{background:var(--card-2);color:var(--ink-2);font-weight:500;text-align:right;vertical-align:bottom;position:sticky;top:0}
.stbl2 thead th span{display:block;font-size:10.5px;color:var(--ink-3)}
.stbl2 thead th:first-child,.stbl2 tbody th{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
.stbl2 thead th:first-child{background:var(--card-2)}
.stbl2 tbody th{font-weight:500}
.stbl2 td{text-align:right;font-family:var(--f-num)}
.stbl2 td.pct{color:var(--accent)} .stbl2 td.nil{color:var(--ink-3)}
.stbl2 tr.tot th,.stbl2 tr.tot td{font-weight:700;background:var(--accent-soft)}
.stbl2 tbody tr:hover td,.stbl2 tbody tr:hover th{background:var(--card-2)}
.st-block details summary{cursor:pointer;color:var(--accent);font-size:12.5px}

<body>
<div id="login" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><div class="mark">Ex</div><span>ExKey 採用ボード</span></div>
    <div class="curjob" id="curjob" hidden></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main>
    <div class="topbar">
      <input type="search" id="q" placeholder="名前・会社・職歴で検索" aria-label="応募者を検索">
      <span class="mode" id="mode">日程調整の送信：–</span>
      <span class="date" id="date"></span>
      <span class="who" id="who"></span><button class="lo" id="logout" type="button">ログアウト</button>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
  "use strict";
  const API_URL="https://script.google.com/macros/s/AKfycbxFms1TAYk5h_hb3O5DTy3hgy-kBexTdlBY4rqWLiATYj-UMtSyP9-p3fQq1dlw4i_P/exec";
  const BUILD="20261127231057";
  // 新しい版が公開されたら自動で読み込み直す（GitHub Pages は最大10分ほど古い版を返すことがある）
  async function checkVersion(){try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});const t=await r.text();const m=t.match(/const BUILD="(\d+)"/);if(m&&m[1]!==BUILD&&!document.querySelector(".overlay")&&!document.querySelector("form textarea:focus"))location.replace(location.pathname+"?v="+m[1]);}catch(e){}}
  setTimeout(checkVersion,1500);setInterval(checkVersion,5*60000);
  const NS="rb_"+API_URL.replace(/\/exec$/,"").slice(-12);
  const ICON={
    home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    task:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    reply:'<path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/>',
    cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    req:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>',
    scout:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
    list:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
    check:'<path d="M5 12l5 5 9-10"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'
  };
  const svg=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[k]+'</svg>';
  const VIEWS=[
    {id:"home",label:"ホーム",icon:"home"},
    {id:"docs",label:"書類選考",icon:"task",badge:()=>kindRows("doc").length},
    {id:"after",label:"面接後の判断",icon:"check",badge:()=>kindRows("after").length},
    {id:"tasks",label:"確認・要対応",icon:"reply",badge:()=>kindRows("send").length+kindRows("check").length},
    {id:"replies",label:"返信待ち",icon:"reply",badge:()=>replies().length},
    {id:"sched",label:"日程・面談",icon:"cal",badge:()=>state.apps.filter(a=>a.status==="送信確認待ち").length+todays().filter(a=>!doneToday(a)).length},
    {id:"interviews",label:"面接記録",icon:"mic",badge:()=>state.ivs.filter(v=>byJobIv(v)&&(v.pending||[]).some(p=>p.status==="整形待ち")).length},
    {id:"requests",label:"依頼・指示",icon:"req",badge:()=>state.reqs.filter(r=>r.status==="要確認").length},
    {id:"scout",label:"スカウト",icon:"scout"},
    {id:"stats",label:"集計・分析",icon:"check"},
    {id:"all",label:"応募者一覧",icon:"list"},
    {id:"settings",label:"設定",icon:"gear",admin:true}
  ];
  const JOBKEY={"広告運用":"ad","AIディレクター":"aid","AIサポート":"aisupport","デザイナー":"designer","AI常駐":"airesident","MEO運用":"meo"};
  const ROUNDS=["1次","2次","3次","4次","5次"];
  const INTERVIEWERS=["内田","折山"];
  const ENDED=["見送り","辞退","欠席","内定"];
  const state={view:"home",all:[],apps:[],reqs:[],ivs:[],settings:null,scouts:null,stats:{},jobs:null,selJob:null,detail:null,q:"",job:"すべて",stFilter:"進行中",me:null,confirming:null,nexting:null,busy:{},loaded:false,users:null,ivOpen:null};
  try{const v=localStorage.getItem(NS+"view");if(v&&VIEWS.some(x=>x.id===v))state.view=v;const j=localStorage.getItem(NS+"job");if(j)state.selJob=j;}catch(e){}
  const $=s=>document.querySelector(s);
  const z=n=>String(n).padStart(2,"0");
  function today(){const d=new Date();return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
  function days(s){if(!s)return null;return Math.round((new Date(today()+"T00:00:00")-new Date(String(s).slice(0,10)+"T00:00:00"))/864e5);}
  function el(t,a,...k){const e=document.createElement(t);if(a)for(const[n,v]of Object.entries(a)){if(v==null||v===false)continue;if(n==="class")e.className=v;else if(n==="html")e.innerHTML=v;else if(n.startsWith("on"))e.addEventListener(n.slice(2),v);else e.setAttribute(n,v===true?"":v);}for(const c of k){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
  function when(s){if(!s)return"";const str=String(s);const d=new Date(str.length===10?str+"T00:00:00":str);if(isNaN(d))return str;const w="日月火水木金土"[d.getDay()];const base=(d.getMonth()+1)+"/"+d.getDate()+"("+w+")";return str.length===10?base:base+" "+z(d.getHours())+":"+z(d.getMinutes());}
  function hm(s){const d=new Date(s);return isNaN(d)||String(s).length<=10?"":z(d.getHours())+":"+z(d.getMinutes());}
  function md(s){return s?String(s).slice(5,10).replace("-","/"):"";}
  const nk=s=>String(s||"").replace(/[\s　]/g,"").replace(/[（(].*$/,"").replace(/さん$/,"");
  const isAfter=a=>["実施済み","選考中"].includes(a.status)||(a.status==="日程確定"&&a.interviewAt&&String(a.interviewAt).slice(0,10)<today());
  const tasks=()=>state.apps.filter(a=>["未選考","送信確認待ち","要確認"].includes(a.status)||isAfter(a));
  function taskKind(a){
    if(a.status==="未選考")return {k:"doc",l:"書類選考：1次面接に進めるか判断"};
    if(a.status==="送信確認待ち")return {k:"send",l:"送信の確認："+((a.nextRound&&a.nextRound.round)||"1次")+"面接の日程調整メッセージ"};
    if(a.status==="要確認")return {k:"check",l:"要確認"};
    if(isAfter(a)){const r=roundOf(a);return {k:"after",l:r+"面接後："+nextRound(r)+"面接に進めるか判断（内定・見送りも）"};}
    return null;
  }
  const replies=()=>state.apps.filter(a=>a.reply&&!a.reply.handled);
  // 面接記録（所感 or 貼った文字起こし）がその回について入っているか
  function hasRecord(a){const iv=ivFor(a);if(!iv)return false;const r=roundOf(a);return (iv.rounds||[]).some(x=>x.round===r&&x.comment&&String(x.comment).trim())||(iv.pending||[]).some(p=>p.round===r);}
  const ivDate=a=>String(a.interviewAt||"").slice(0,10);
  // 今日の面接＋過去の面接で記録がまだの人（記録が入るまでずっと残す）
  const todays=()=>state.apps.filter(a=>{if(!a.interviewAt||ivDate(a)>today())return false;
    if(ivDate(a)===today()&&a.lastResultDate===today()&&["欠席","辞退","日程調整中"].includes(a.status))return true;
    return ["日程確定","選考中","実施済み"].includes(a.status)&&!hasRecord(a);}).sort((x,y)=>String(x.interviewAt).localeCompare(String(y.interviewAt)));
  const todayOnly=()=>state.apps.filter(a=>a.interviewAt&&ivDate(a)===today()&&!["見送り","内定"].includes(a.status));
  const doneToday=a=>["欠席","辞退","日程調整中"].includes(a.status)&&a.lastResultDate===today();
  const STATUS_COLOR={"未選考":"orange","通過":"blue","日程調整中":"blue","選考中":"blue","送信確認待ち":"red","要確認":"red","日程確定":"green","実施済み":"blue","内定":"green","見送り":"grey","辞退":"grey","欠席":"grey"};
  function matchQ(a){const q=state.q.trim().toLowerCase();return !q||[a.name,a.company,a.school,a.summary,a.media,a.job].join(" ").toLowerCase().includes(q);}
  const roundOf=a=>a.currentRound||"1次";
  const nextRound=r=>ROUNDS[Math.min(ROUNDS.length-1,ROUNDS.indexOf(r)+1)]||"2次";
  function ivFor(a){return state.ivs.find(v=>v.applicantId===a.id)||state.ivs.find(v=>nk(v.name)&&nk(v.name)===nk(a.name));}
  function byJobIv(v){if(!state.selJob||state.selJob==="すべての職種")return true;return (v.job||"広告運用")===state.selJob;}

  // ---------------------------------------------------------------- 通信
  let token="";try{token=localStorage.getItem(NS+"token")||"";}catch(e){}
  async function post(body,retry){
    retry=retry==null?2:retry;
    try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(body),credentials:"omit",redirect:"follow"});const j=await r.json();return j;}
    catch(e){if(retry>0){await new Promise(r=>setTimeout(r,800));return post(body,retry-1);}return {ok:false,error:"通信できませんでした。ネットワークを確認してください"};}
  }
  async function api(name,...args){
    const j=await post({action:"call",token,name,args});
    if(!j.ok){if(j.auth){logout(true);}throw new Error(j.error||"エラーが発生しました");}
    return j.data;
  }
  function logout(expired){try{localStorage.removeItem(NS+"token");}catch(e){}if(token&&!expired)post({action:"logout",token});token="";state.me=null;showLogin(expired?"ログインの有効期限が切れました。もう一度ログインしてください。":"");}

  function ingest(d){
    const docs=d.docs||{};state.me=d.me;
    const by=p=>Object.keys(docs).filter(k=>k.startsWith(p+"/")).map(k=>Object.assign({id:k.slice(p.length+1),_path:k},docs[k]));
    state.all=by("applicants");state.reqs=by("requests");state.ivs=by("interviews");
    const st={};by("stats").forEach(s=>st[s.id]=s);state.stats=st;
    state.jobs=docs["meta/jobs"]||null;state.settings=docs["meta/settings"]||null;state.scouts=docs["meta/scouts"]||null;
    state.loaded=true;state.loadedAt=d.at;if(state.selJob&&state.selJob!=="すべての職種"&&!activeJobs().includes(state.selJob))state.selJob=null;applyJob();
  }
  async function load(silent){
    try{const d=await api("load");ingest(d);if(!silent)banner("");render();}
    catch(e){if(token)banner("読み込みに失敗しました："+e.message,true);}
  }
  async function upd(path,patch){
    try{const data=await api("update",path,patch);if(data&&data._sheetWarn)banner(data._sheetWarn,true);const [coll,id]=path.split("/");const arr=coll==="applicants"?state.all:coll==="requests"?state.reqs:coll==="interviews"?state.ivs:null;
      if(arr){const i=arr.findIndex(x=>x.id===id);const o=Object.assign({id,_path:path},data);if(i>=0)arr[i]=o;else arr.push(o);}else if(path==="meta/settings")state.settings=data;
      applyJob();return true;}
    catch(e){banner("保存できませんでした："+e.message,true);return false;}
  }
  async function setApp(a,patch){if(state.busy[a.id])return;state.busy[a.id]=true;render();await upd("applicants/"+a.id,patch);delete state.busy[a.id];render();}
  function banner(m,err){const b=$("#banner");b.textContent=m||"";b.className="banner"+(err?" err":"");b.hidden=!m;}
  const activeJobs=()=>(state.jobs&&state.jobs.active)||["広告運用","AIディレクター","AIサポート"];
  function applyJob(){state.apps=state.all.filter(a=>state.selJob==="すべての職種"||!state.selJob?activeJobs().includes(a.job):a.job===state.selJob);}
  function pickJob(j){state.selJob=j;try{j?localStorage.setItem(NS+"job",j):localStorage.removeItem(NS+"job")}catch(e){}applyJob();state.view="home";render();window.scrollTo(0,0);}

  // ---------------------------------------------------------------- 応募者カード
  function pillText(a){
    if(a.status==="通過"){const n=a.nextRound;return n?n.round+"面接（"+(n.mode||"")+"）の日程調整待ち":"送信待ち（次回の自動処理）";}
    if(a.status==="日程確定")return roundOf(a)+"面接 日程確定";
    if(a.status==="日程調整中")return roundOf(a)+"面接 日程調整中";
    if(a.status==="実施済み")return roundOf(a)+"面接 実施済み";
    return a.status;
  }
  function nextForm(a){
    const cur=a.status==="未選考"||a.status==="要確認"?null:roundOf(a);const def=cur?nextRound(cur):"1次";
    const f=el("form",{class:"inline-form",onsubmit:e=>{e.preventDefault();const fd=new FormData(f);const r=fd.get("round"),mode=fd.get("mode"),who=fd.get("who");state.nexting=null;
      setApp(a,{status:"通過",decidedAt:new Date().toISOString(),note:"",nextRound:{round:r,mode:r==="1次"?"オンライン（TimeRex）":mode,interviewer:who,requestedAt:new Date().toISOString()}});}},
      el("label",{},"面接",el("select",{name:"round"},...ROUNDS.map(r=>el("option",{selected:r===def?true:null},r)))),
      el("label",{},"形式",el("select",{name:"mode"},el("option",{},"オンライン"),el("option",{},"対面"))),
      el("label",{},"面接者",el("select",{name:"who"},...INTERVIEWERS.map(x=>el("option",{},x)),el("option",{},"内田・折山"))),
      el("button",{class:"btn pri",type:"submit"},"日程調整を頼む"),el("button",{class:"btn",type:"button",onclick:()=>{state.nexting=null;render();}},"やめる"),
      el("span",{class:"muted wide"},"対面は面接者のサイボウズの空きから候補日を出して調整します。オンラインはTimeRexで送ります。"));
    return f;
  }
  function appCard(a,opt){
    opt=opt||{};
    const d=days(a.appliedAt);const late=a.status==="未選考"&&d!=null&&d>=3;
    const c=el("article",{class:"app-card"+(late?" late":"")},
      el("div",{},
        el("div",{style:"display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline"},el("button",{class:"linkname nm",onclick:()=>openDetail(a)},a.name||"（名前なし）"),el("span",{class:"mt"},[a.age,a.company,a.school].filter(Boolean).join(" ／ "))),
        el("div",{class:"tags",style:"margin-top:6px"},
          el("span",{class:"tag job"},a.job||"職種未設定"),
          el("span",{class:"tag"},(a.media||"")+(a.route?"・"+a.route:"")),
          a.appliedAt?el("span",{class:"tag"+(late?" late":"")},"応募 "+md(a.appliedAt)+(d!=null?"（"+(d===0?"今日":d+"日前")+"）":"")):null,
          a.sheetRow?el("span",{class:"tag"},(a.tab||"").replace("⭐️","")+" "+a.sheetRow+"行目"):null,
          ivFor(a)?el("span",{class:"tag ok"},"面接記録あり"):null)),
      el("span",{class:"pill p-"+a.status},pillText(a)));
    const tk=taskKind(a);if(tk)c.append(el("div",{class:"task-label t-"+tk.k},tk.l));
    if(a.remindedAt&&a.status==="日程調整中")c.append(el("div",{class:"note"},"返信がないため "+md(a.remindedAt)+" にリマインドを送信済み"));
    if(a.interviewAt&&["日程確定","選考中"].includes(a.status))c.append(el("div",{class:"note"},roundOf(a)+"面接 "+when(a.interviewAt)+(a.interviewMode?"（"+a.interviewMode+"）":"")+(a.interviewer?" 面接者："+a.interviewer:"")));
    if(a.reply&&!a.reply.handled)c.append(el("div",{class:"note reply"},"返信あり（"+when(a.reply.at)+"）："+(a.reply.text||"")));
    if(a.note)c.append(el("div",{class:"note"+(["要確認","送信確認待ち"].includes(a.status)?" warn":"")},a.note));
    if(!opt.compact)c.append(el("div",{class:"sum"+(a.summary?"":" empty")},a.summary||"職歴の要約はまだありません（次回の自動処理で入ります）"));
    const acts=el("div",{class:"acts"});const dis=!!state.busy[a.id];const now=new Date().toISOString();
    if(state.nexting===a.id){c.append(nextForm(a));return c;}
    if(a.status==="未選考"||a.status==="要確認"){
      if(state.confirming===a.id){acts.append(el("span",{class:"muted"},"見送りにしますか？"),el("button",{class:"btn dng",disabled:dis,onclick:()=>{state.confirming=null;setApp(a,{status:"見送り",decidedAt:now,note:""});}},"見送りにする"),el("button",{class:"btn",onclick:()=>{state.confirming=null;render();}},"やめる"));}
      else acts.append(el("button",{class:"btn pri",disabled:dis,onclick:()=>setApp(a,{status:"通過",decidedAt:now,note:"",nextRound:{round:"1次",mode:"オンライン（TimeRex）",interviewer:"内田",requestedAt:now}})},"1次面接に進める"),el("button",{class:"btn",disabled:dis,onclick:()=>{state.confirming=a.id;render();}},"見送り"));
    }else if(a.status==="通過"){acts.append(el("span",{class:"muted"},"次の自動処理で日程調整の連絡をします。"),el("button",{class:"btn",disabled:dis,onclick:()=>setApp(a,{status:a.currentRound?"実施済み":"未選考",nextRound:null,decidedAt:null})},"取り消す"));}
